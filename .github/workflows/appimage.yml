name: Test and build AppImage

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # A release published on github.com with a new tag; the tag alone may not count as a push.
  release:
    types: [published]

permissions:
  contents: read

env:
  QT_LIBS: >-
    libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0
    libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0
    libxcb-xkb1 libxcb-util1 libfontconfig1 libdbus-1-3 libglib2.0-0

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Libraries Qt needs
        run: sudo apt-get update -q && sudo apt-get install -y -q $QT_LIBS
      - run: pip install -e '.[dev]'
      - run: ruff check src tests packaging
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  appimage:
    needs: test
    # Build on the oldest system we support: the AppImage needs at least this glibc (2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Libraries Qt needs (bundled into the AppImage where allowed)
        run: sudo apt-get update -q && sudo apt-get install -y -q $QT_LIBS
      - run: pip install -e '.[dev]'
      - name: Build
        run: PYTHON=python packaging/build_appimage.sh
      - name: Self-test the AppImage
        run: dist/*.AppImage --self-test --online
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v5
        with:
          name: autoproton-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  distros:
    needs: appimage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "debian:12", "fedora:latest", "archlinux:latest", "opensuse/tumbleweed:latest"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: autoproton-AppImage
      - name: Install what any desktop already has (graphics, fonts, D-Bus)
        run: |
          . /etc/os-release
          case "$ID" in
            ubuntu|debian)
              apt-get update -q && apt-get install -y -q libegl1 libgl1 libfontconfig1 fonts-dejavu-core \
                libxkbcommon0 libdbus-1-3 libglib2.0-0 libx11-xcb1 libwayland-client0 libwayland-cursor0 \
                libwayland-egl1 ca-certificates ;;
            fedora)
              dnf -y -q install mesa-libEGL mesa-libGL fontconfig dejavu-sans-fonts libxkbcommon dbus-libs \
                libX11-xcb glib2 libwayland-client libwayland-cursor libwayland-egl ;;
            arch)
              pacman -Sy --noconfirm --needed mesa libglvnd fontconfig ttf-dejavu libxkbcommon dbus glib2 \
                wayland libx11 ;;
            opensuse-tumbleweed)
              zypper -n -q in Mesa-libEGL1 Mesa-libGL1 fontconfig dejavu-fonts libxkbcommon0 libdbus-1-3 \
                libglib-2_0-0 libgthread-2_0-0 libX11-xcb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 ;;
          esac
      - name: Self-test
        run: chmod +x ./*.AppImage && ./*.AppImage --self-test
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, distros]
    runs-on: ubuntu-latest
    # the tag push and the release event can both fire; upload one at a time
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: autoproton-AppImage
      - name: Release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            mkdir -p docs/releases
            printf 'autoproton %s. See the README for how to download and run it.\n' "$GITHUB_REF_NAME" > "$notes"
          fi
          echo "NOTES=$notes" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.AppImage"
          body_path: ${{ env.NOTES }}
          fail_on_unmatched_files: true
